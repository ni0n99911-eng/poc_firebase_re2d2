<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e3a2a">
<title>RE² — Offline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #1e3a2a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }
  .logo { font-family: Georgia, serif; font-size: 32px; font-weight: 700; margin-bottom: 32px; color: #fff; }
  .logo sup { font-size: 16px; color: #7bbf94; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 14px; color: #a3c4a8; line-height: 1.6; max-width: 280px; margin-bottom: 28px; }
  button {
    background: #f5f0e8; color: #1e3a2a; border: none;
    border-radius: 10px; padding: 14px 28px; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
  <div class="logo">RE<sup>2</sup></div>
  <h1>You're offline</h1>
  <p>RE² needs a connection to score locations. Connect to Wi-Fi or cellular and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
</body>
</html>
