<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RE² — Chat Onboarding</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #F6F8FB;
    --white: #FFFFFF;
    --surface: #FFFFFF;
    --surface-alt: #F0F3F7;
    --border: #E0E5ED;
    --border-subtle: #EBF0F5;
    --border-hover: #CBD2DE;
    --teal: #0D7C6E;
    --teal-bright: #0D9488;
    --teal-soft: rgba(13,124,110,0.05);
    --teal-glow: rgba(13,124,110,0.1);
    --teal-bg: rgba(13,124,110,0.06);
    --amber: #B45309;
    --text: #1A202C;
    --text-secondary: #5A6578;
    --text-dim: #8A95A8;
    --text-muted: #B0B9C8;
    --green: #059669;
    --green-soft: rgba(5,150,105,0.06);
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
  }

  .app-shell { display: flex; height: 100vh; width: 100vw; }

  /* ─── Guidemap ─── */
  .guidemap {
    width: 220px;
    background: var(--white);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    flex-shrink: 0;
  }

  .guidemap-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    color: var(--text);
    padding: 0 28px;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .guidemap-logo span { color: var(--teal); font-size: 13px; vertical-align: super; }

  .guidemap-subtitle {
    font-size: 11px; color: var(--text-dim);
    padding: 0 28px;
    margin-bottom: 40px;
    letter-spacing: 0.3px;
    line-height: 1.5;
  }

  .guidemap-steps {
    flex: 1;
    padding: 0 28px;
    position: relative;
  }
  .guidemap-steps::before {
    content: '';
    position: absolute;
    left: 39px; top: 8px; bottom: 8px;
    width: 1.5px;
    background: var(--border);
    border-radius: 1px;
  }

  .guidemap-line-fill {
    position: absolute;
    left: 39px; top: 8px;
    width: 1.5px;
    background: var(--teal);
    border-radius: 1px;
    transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
  }

  .guide-step {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    position: relative; z-index: 2;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .guide-node {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s;
    position: relative;
  }
  .guide-node svg { width: 10px; height: 10px; stroke: var(--green); stroke-width: 2.5; fill: none; opacity: 0; transition: opacity 0.3s; }

  .guide-step.completed .guide-node { border-color: var(--teal); background: var(--teal-soft); }
  .guide-step.completed .guide-node svg { opacity: 1; stroke: var(--teal); }
  .guide-step.active .guide-node { border-color: var(--teal); background: var(--teal); box-shadow: 0 0 0 4px rgba(13,124,110,0.08); }
  .guide-step.active .guide-node::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: white; position: absolute; }
  .guide-step.upcoming { opacity: 0.35; }
  .guide-step.upcoming .guide-node { border-style: dashed; }

  .guide-label { font-size: 13px; font-weight: 500; color: var(--text-dim); transition: color 0.3s; letter-spacing: -0.1px; }
  .guide-step.completed .guide-label { color: var(--text-secondary); }
  .guide-step.active .guide-label { color: var(--text); font-weight: 600; }
  .guide-sublabel { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; opacity: 0; transition: opacity 0.3s; }
  .guide-step.active .guide-sublabel { opacity: 1; color: var(--text-secondary); }

  .guidemap-footer {
    padding: 20px 28px 0;
    border-top: 1px solid var(--border-subtle);
    margin-top: auto;
  }
  .guidemap-footer-text { font-size: 11px; color: var(--text-dim); line-height: 1.6; }

  /* ─── Chat Panel ─── */
  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .chat-header {
    height: 48px;
    background: rgba(246,248,251,0.9);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 24px;
    flex-shrink: 0;
  }
  .chat-header-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 8px; }
  .chat-header-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.3px; }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
    background: var(--bg);
  }
  .chat-scroll::-webkit-scrollbar { width: 3px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chat-thread {
    max-width: 620px;
    margin: 0 auto;
    padding: 32px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ─── Bubbles ─── */
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    opacity: 0;
    transform: translateY(8px);
    animation: msgIn 0.3s ease-out forwards;
  }
  .msg-row.ai { justify-content: flex-start; }
  .msg-row.founder { justify-content: flex-end; padding-left: 40px; }
  @keyframes msgIn { to { opacity: 1; transform: translateY(0); } }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 10px; font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .bubble {
    padding: 13px 17px;
    font-size: 14.5px;
    line-height: 1.7;
    max-width: min(80%, 500px);
    word-wrap: break-word;
  }
  .bubble p + p { margin-top: 10px; }

  .bubble.ai {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 4px 16px 16px 16px;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }

  .bubble.founder {
    background: var(--teal);
    border-radius: 16px 4px 16px 16px;
    color: white;
  }

  .bubble .insight {
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.65;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-subtle);
    font-style: italic;
  }
  .bubble .stat { color: var(--teal); font-weight: 600; font-style: normal; }

  /* ─── Typing ─── */
  .typing { display: flex; gap: 4px; padding: 6px 4px; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); animation: typePulse 1.2s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typePulse { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 0.9; } }

  /* ─── Business Cards ─── */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 14px;
  }
  .type-card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .type-card:hover { border-color: var(--border-hover); background: var(--white); }
  .type-card.selected { border-color: var(--teal); background: var(--teal-soft); }

  .type-card-icon {
    width: 32px; height: 32px;
    margin: 0 auto 6px;
    border-radius: 8px;
    background: var(--white);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .type-card.selected .type-card-icon { background: var(--teal-bg); border-color: var(--teal-glow); }
  .type-card-icon svg { width: 15px; height: 15px; stroke: var(--text-dim); stroke-width: 1.5; fill: none; }
  .type-card.selected .type-card-icon svg { stroke: var(--teal); }
  .type-card-name { font-size: 11px; font-weight: 500; color: var(--text-dim); }
  .type-card.selected .type-card-name { color: var(--text); }

  .type-card-check {
    position: absolute; top: 5px; right: 5px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--teal);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .type-card.selected .type-card-check { display: flex; }
  .type-card-check svg { width: 8px; height: 8px; stroke: white; stroke-width: 2.5; fill: none; }

  /* ─── Chips ─── */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .chip {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    font-size: 12.5px; font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip:hover { border-color: var(--teal); color: var(--text); background: var(--teal-soft); }

  /* ─── Smart Defaults ─── */
  .defaults-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-top: 12px;
  }
  .defaults-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-dim); margin-bottom: 14px; }
  .default-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .default-row:last-of-type { border-bottom: none; }
  .default-label { font-size: 12.5px; color: var(--text-secondary); }
  .default-value { font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .defaults-note { font-size: 11px; color: var(--text-dim); margin-top: 12px; line-height: 1.55; font-style: italic; }

  /* ─── Address Card ─── */
  .address-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 12px;
  }
  .address-map {
    height: 100px;
    background: linear-gradient(135deg, #E8ECF2 0%, #DCE2EA 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .address-map-dot {
    width: 10px; height: 10px;
    background: var(--teal);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(13,124,110,0.12);
  }
  .address-map-grid {
    position: absolute; inset: 0;
    opacity: 0.06;
    background-image:
      linear-gradient(var(--text-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--text-dim) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .address-info { padding: 12px 14px; }
  .address-street { font-size: 13px; font-weight: 600; color: var(--text); }
  .address-area { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

  /* ─── Scoring Progress ─── */
  .scoring-inline { margin-top: 12px; display: flex; flex-direction: column; gap: 9px; }
  .score-step { display: flex; align-items: center; gap: 10px; opacity: 0; animation: stepIn 0.3s ease-out forwards; }
  .score-step:nth-child(1) { animation-delay: 0.1s; }
  .score-step:nth-child(2) { animation-delay: 0.7s; }
  .score-step:nth-child(3) { animation-delay: 1.3s; }
  .score-step:nth-child(4) { animation-delay: 1.9s; }
  .score-step:nth-child(5) { animation-delay: 2.5s; }
  .score-step:nth-child(6) { animation-delay: 3.1s; }
  @keyframes stepIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
  .score-check {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: checkIn 0.3s ease-out 0.2s forwards;
  }
  @keyframes checkIn { to { border-color: var(--teal); background: var(--teal-soft); } }
  .score-check svg { width: 8px; height: 8px; stroke: var(--teal); stroke-width: 2.5; fill: none; }
  .score-step-label { font-size: 12.5px; color: var(--text-secondary); }

  /* ─── Input Bar ─── */
  .input-bar {
    background: rgba(246,248,251,0.95);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-subtle);
    padding: 14px 24px;
    flex-shrink: 0;
  }
  .input-row { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  .input-field {
    flex: 1;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    resize: none;
    line-height: 1.4;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: var(--border-hover); }
  .input-field::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .send-btn:hover { background: #0B6B5F; }
  .send-btn svg { width: 16px; height: 16px; stroke: white; stroke-width: 2; fill: none; }

  /* ─── Demo pills ─── */
  .demo-pills {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 4px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3px 5px;
    z-index: 200;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .demo-pill {
    background: transparent;
    border: none; border-radius: 12px;
    padding: 4px 10px;
    color: var(--text-dim);
    font-size: 10px; font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .demo-pill:hover { color: var(--text-secondary); }
  .demo-pill.active { background: var(--teal-bg); color: var(--teal); }

  @media (max-width: 768px) {
    .guidemap { display: none; }
    .bubble { max-width: 88%; font-size: 14px; }
    .type-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="app-shell">
  <aside class="guidemap">
    <div class="guidemap-logo">RE<span>2</span></div>
    <div class="guidemap-subtitle">Location intelligence<br>for first-time founders</div>
    <div class="guidemap-steps" id="guidemapSteps">
      <div class="guidemap-line-fill" id="lineFill" style="height: 0px"></div>
      <div class="guide-step active" data-step="1"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Business</div><div class="guide-sublabel">What are you building?</div></div></div>
      <div class="guide-step upcoming" data-step="2"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Vision</div><div class="guide-sublabel">Your concept and name</div></div></div>
      <div class="guide-step upcoming" data-step="3"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Customers</div><div class="guide-sublabel">Who you're serving</div></div></div>
      <div class="guide-step upcoming" data-step="4"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Financials</div><div class="guide-sublabel">The numbers that matter</div></div></div>
      <div class="guide-step upcoming" data-step="5"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Location</div><div class="guide-sublabel">The address to score</div></div></div>
      <div class="guide-step upcoming" data-step="6"><div class="guide-node"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="guide-label">Your Score</div><div class="guide-sublabel">Location IQ + Fit IQ</div></div></div>
    </div>
    <div class="guidemap-footer"><div class="guidemap-footer-text">Takes about 5 minutes.<br>No sign-up required.</div></div>
  </aside>

  <main class="chat-panel">
    <div class="chat-header"><div class="chat-header-dot"></div><div class="chat-header-title">Location Coach</div></div>
    <div class="chat-scroll" id="chatScroll"><div class="chat-thread" id="chatThread"></div></div>
    <div class="input-bar">
      <div class="input-row">
        <textarea class="input-field" rows="1" placeholder="Type your answer..." id="inputField"></textarea>
        <button class="send-btn" onclick="handleSend()"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg></button>
      </div>
    </div>
  </main>
</div>

<nav class="demo-pills">
  <button class="demo-pill active" onclick="showScene(1)">1</button>
  <button class="demo-pill" onclick="showScene(2)">2</button>
  <button class="demo-pill" onclick="showScene(3)">3</button>
  <button class="demo-pill" onclick="showScene(4)">4</button>
  <button class="demo-pill" onclick="showScene(5)">5</button>
  <button class="demo-pill" onclick="showScene(6)">6</button>
</nav>

<script>
const thread=document.getElementById('chatThread'),scroll=document.getElementById('chatScroll'),lineFill=document.getElementById('lineFill');
const chk='<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const icons={coffee:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',restaurant:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><line x1="7" y1="2" x2="7" y2="22"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>',florist:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V8"/><path d="M5.5 11.5A4.5 4.5 0 1 1 12 8a4.5 4.5 0 1 1 6.5 3.5"/><path d="M8 14a4.5 4.5 0 0 0 8 0"/></svg>',dental:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',spa:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c-4-3-8-6-8-11a8 8 0 1 1 16 0c0 5-4 8-8 11z"/><circle cx="12" cy="11" r="3"/></svg>',fitness:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="4" height="14" rx="1"/><rect x="18" y="5" width="4" height="14" rx="1"/><line x1="6" y1="8" x2="18" y2="8"/><line x1="6" y1="16" x2="18" y2="16"/><line x1="12" y1="5" x2="12" y2="19"/></svg>',barber:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12"/><path d="M20 4L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></svg>',retail:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 7v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-3-5z"/><line x1="3" y1="7" x2="21" y2="7"/><path d="M16 11a4 4 0 0 1-8 0"/></svg>',other:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'};
const types=[{key:'coffee',name:'Coffee Shop'},{key:'restaurant',name:'Restaurant'},{key:'florist',name:'Florist'},{key:'dental',name:'Medical'},{key:'spa',name:'Spa / Wellness'},{key:'fitness',name:'Fitness'},{key:'barber',name:'Barbershop'},{key:'retail',name:'Retail'},{key:'other',name:'Something else'}];

function typeGrid(sel){return '<div class="type-grid">'+types.map(t=>`<div class="type-card${t.key===sel?' selected':''}" onclick="selectType(this)"><div class="type-card-icon">${icons[t.key]}</div><div class="type-card-name">${t.name}</div><div class="type-card-check">${chk}</div></div>`).join('')+'</div>';}
function selectType(el){el.closest('.type-grid').querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');}

function setGuide(n){document.querySelectorAll('.guide-step').forEach((s,i)=>{s.classList.remove('completed','active','upcoming');if(i+1<n)s.classList.add('completed');else if(i+1===n)s.classList.add('active');else s.classList.add('upcoming');});lineFill.style.height=Math.max(0,(n-1)*60)+'px';}

const scenes={
1:{g:1,m:[{role:'ai',html:`<p>Hey, I'm your location coach at RE<sup style="font-size:9px">2</sup>. I help first-time founders figure out if a location is right for their business -- before they sign anything.</p><p>What kind of business are you thinking about?</p>${typeGrid()}`}]},
2:{g:2,m:[{role:'ai',html:`<p>What kind of business are you thinking about?</p>${typeGrid('coffee')}`},{role:'founder',html:'<p>Coffee Shop</p>'},{role:'ai',html:`<p>Good pick. Coffee's a crowded market in NYC but the shops that carve out a real identity tend to do well. The ones that struggle are usually trying to out-Starbucks Starbucks on price.</p><p>Tell me about your vision -- what's the name, and what would make someone walk past three other shops to get to yours?</p><p class="insight">Shops with a distinct specialty see <span class="stat">40% higher</span> customer retention than generalists in NYC.</p>`}]},
3:{g:3,m:[{role:'founder',html:'<p>Coffee Shop</p>'},{role:'ai',html:'<p>Tell me about your vision -- what would make someone walk past three other shops to get to yours?</p>'},{role:'founder',html:'<p>Kohi -- a Japanese-inspired matcha and pour-over bar. Minimal aesthetic. Evenings transition to sake and small plates.</p>'},{role:'ai',html:`<p>The dual-revenue model is smart. You're paying for the space around the clock, might as well use more of it. The matcha angle has real traction right now, especially if you're sourcing directly.</p><p>Who's your ideal regular -- the person who shows up three times a week?</p><div class="chips"><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Remote workers</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Young professionals</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Health-conscious</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Date-night couples</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Students</span></div>`},{role:'founder',html:'<p>Remote workers during the day, date-night couples in the evening</p>'},{role:'ai',html:`<p>That split works well. Remote workers need outlets, decent wifi, and tables that fit a laptop -- worth factoring in when you're evaluating space. Evening crowd wants atmosphere and foot traffic that skews 25-40.</p><p>What sets you apart from the matcha spots already out there? The thing only you would do.</p>`}]},
4:{g:4,m:[{role:'founder',html:'<p>Remote workers during the day, date-night couples in the evening</p>'},{role:'ai',html:'<p>What sets you apart from the matcha spots already out there?</p>'},{role:'founder',html:"<p>Direct-import Japanese ceremonial grade matcha. The evening sake menu is curated by a sommelier friend. Nobody's doing matcha-to-sake in NYC.</p>"},{role:'ai',html:`<p>That's a real differentiator. The sourcing story alone is marketing gold -- people share that kind of thing.</p><p>Let me sketch out the financials based on what you've told me and what I know about similar concepts in the city.</p><div class="defaults-card"><div class="defaults-header">Estimated benchmarks</div><div class="default-row"><span class="default-label">Daytime avg ticket</span><span class="default-value">$8 -- $12</span></div><div class="default-row"><span class="default-label">Evening avg per person</span><span class="default-value">$35 -- $50</span></div><div class="default-row"><span class="default-label">Daily customers</span><span class="default-value">100 -- 150</span></div><div class="default-row"><span class="default-label">Ideal space</span><span class="default-value">800 -- 1,200 sqft</span></div><div class="default-row"><span class="default-label">Max healthy rent</span><span class="default-value">$8K -- $12K /mo</span></div><p class="defaults-note">Based on NYC specialty coffee benchmarks, adjusted for dual-revenue model.</p></div><div class="chips"><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Looks about right</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">Let me adjust</span><span class="chip" onclick="this.style.borderColor='var(--teal)';this.style.color='var(--text)'">No clue, use these</span></div>`}]},
5:{g:5,m:[{role:'founder',html:'<p>Evening pricing is more like $45-55 with sake pairings. Otherwise looks right.</p>'},{role:'ai',html:`<p>Noted, pushing your evening average up. That changes the revenue ceiling in a good way.</p><p>Alright, you've got a solid concept. Got an address you're looking at? Even just a neighborhood works -- I'll take whatever you've got.</p><p class="insight">For a day/night concept, neighborhoods with residential density <em>and</em> nightlife foot traffic will score highest. Think East Village, Williamsburg, LES.</p>`},{role:'founder',html:'<p>127 E 7th St, Manhattan</p>'},{role:'ai',html:`<p>East Village -- strong pick for this concept. High foot traffic, good 25-35 demographic, solid evening scene.</p><div class="address-card"><div class="address-map"><div class="address-map-grid"></div><div class="address-map-dot"></div></div><div class="address-info"><div class="address-street">127 E 7th St</div><div class="address-area">East Village, Manhattan, NY 10009</div></div></div>`}]},
6:{g:6,m:[{role:'founder',html:'<p>127 E 7th St, Manhattan</p>'},{role:'ai',html:`<p>Let me dig into this one for you. Checking across 20+ data sources.</p><div class="scoring-inline"><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Foot traffic patterns and pedestrian flow</span></div><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Nearby competition and market saturation</span></div><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Demographics and income data</span></div><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Crime, safety, and time-of-day patterns</span></div><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Transit access and commuter flow</span></div><div class="score-step"><div class="score-check">${chk}</div><span class="score-step-label">Cross-referencing with your concept</span></div></div>`}]}
};

function showScene(n){const s=scenes[n];if(!s)return;document.querySelectorAll('.demo-pill').forEach((p,i)=>p.classList.toggle('active',i===n-1));setGuide(s.g);thread.innerHTML='';s.m.forEach((msg,i)=>{const row=document.createElement('div');row.className=`msg-row ${msg.role}`;row.style.animationDelay=(i*0.06)+'s';row.innerHTML=msg.role==='ai'?`<div class="avatar">R<sup style="font-size:7px">2</sup></div><div class="bubble ai">${msg.html}</div>`:`<div class="bubble founder">${msg.html}</div>`;thread.appendChild(row);});requestAnimationFrame(()=>{scroll.scrollTop=scroll.scrollHeight;});}

function handleSend(){const input=document.getElementById('inputField');const val=input.value.trim();if(!val)return;const row=document.createElement('div');row.className='msg-row founder';row.innerHTML=`<div class="bubble founder"><p>${val}</p></div>`;thread.appendChild(row);input.value='';const t=document.createElement('div');t.className='msg-row ai';t.innerHTML=`<div class="avatar">R<sup style="font-size:7px">2</sup></div><div class="bubble ai"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;thread.appendChild(t);scroll.scrollTop=scroll.scrollHeight;setTimeout(()=>{t.remove();const r=document.createElement('div');r.className='msg-row ai';r.innerHTML=`<div class="avatar">R<sup style="font-size:7px">2</sup></div><div class="bubble ai"><p>Got it. Let me work that into your profile.</p></div>`;thread.appendChild(r);scroll.scrollTop=scroll.scrollHeight;},1100);}
document.getElementById('inputField').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}});
showScene(1);
</script>
