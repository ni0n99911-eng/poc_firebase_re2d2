[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Timeout applies to all functions (requires Netlify Pro for values > 10s)
  # Location-intel requires ~26s — upgrade to Pro before enabling
  # timeout = 26

# Immutable cache for versioned static assets generated by Vite
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
