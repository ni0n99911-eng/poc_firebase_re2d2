<!doctype html>
<html lang="en">
	<!-- DOMAIN: Update og:url, og:image, twitter:image, canonical when domain changes. See SITE_CONFIG in src/lib/modules.ts -->
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#1e3a2a" />
		<meta name="description" content="RE² — Location intelligence for small business founders. Get your RE² Score across 19 data sources, model finances, and find your perfect spot before you sign." />
		<meta name="robots" content="noarchive, noimageindex" />
		<meta name="author" content="RE² — Real Estate Einstein" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="RE² — Real Estate Einstein" />
		<meta property="og:title" content="RE² — Know Before You Sign" />
		<meta property="og:description" content="Location intelligence for small business founders. Get your RE² Score, model finances, and find your perfect spot." />
		<meta property="og:url" content="https://resquared.io" />
		<meta property="og:image" content="https://resquared.io/icon-512.png" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="RE² — Know Before You Sign" />
		<meta name="twitter:description" content="Location intelligence for small business founders. Get your RE² Score, model finances, and find your perfect spot." />
		<meta name="twitter:image" content="https://resquared.io/icon-512.png" />
		<link rel="canonical" href="https://resquared.io" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="RE²" />
		<meta name="mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	<script>
		// Global error handler: catch unhandled runtime errors and display a visible banner
		function showErrorBanner(message) {
			if (typeof window === 'undefined' || location.hostname === 'localhost') return;

			let banner = document.getElementById('re2-error-banner');
			if (!banner) {
				banner = document.createElement('div');
				banner.id = 're2-error-banner';
				banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:white;padding:12px 16px;font-size:14px;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:pointer;font-family:system-ui,sans-serif';
				document.body.appendChild(banner);
			}
			banner.textContent = message;
			banner.style.display = 'block';

			const timeout = setTimeout(() => { banner.style.display = 'none'; }, 10000);
			banner.onclick = () => { clearTimeout(timeout); banner.style.display = 'none'; };
		}

		window.onerror = (msg, url, line, col, error) => {
			const errorName = error?.name || 'Error';
			const errorMsg = error?.message || msg;
			const fullMsg = `${errorName}: ${errorMsg}`;
			console.error('Unhandled error:', error || msg, `at ${url}:${line}:${col}`);
			showErrorBanner(fullMsg);
			return false;
		};

		window.onunhandledrejection = (event) => {
			const reason = event.reason;
			const errorMsg = reason?.message || String(reason);
			const fullMsg = `Unhandled Promise rejection: ${errorMsg}`;
			console.error('Unhandled rejection:', reason);
			showErrorBanner(fullMsg);
			event.preventDefault();
		};
	</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
